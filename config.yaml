# AI Paper Daily 配置

# 关注的关键词（arXiv 搜索用）
keywords:
  - "LLM agent"
  - "knowledge graph"
  - "knowledge base"
  - "RAG retrieval augmented generation"
  - "multi-agent system"
  - "tool use language model"
  - "agentic AI"

# arXiv 分类（会和关键词组合搜索）
categories:
  - "cs.AI"    # Artificial Intelligence
  - "cs.CL"    # Computation and Language
  - "cs.IR"    # Information Retrieval
  - "cs.MA"    # Multiagent Systems

# 每日推送数量上限
max_papers: 10

# 推送时间：修改 .github/workflows/daily.yml 中的 cron 表达式

# 摘要语言
language: "zh"  # zh=中文, en=英文

# 数据源开关
sources:
  arxiv: true
  huggingface: true

# 推送渠道
notify:
  feishu: true
  email: false

# 周报模式（scripts/main.py --weekly,由 workflow 周一定时触发）
# 从已提交的日报 Markdown 取过去 7 天论文,按热度重排取 top N
weekly: true
weekly_max_papers: 15

# 凭据通过 GitHub Secrets 注入环境变量，不写在这里：
# LLM_API_KEY / LLM_BASE_URL / FEISHU_WEBHOOK
# SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS
