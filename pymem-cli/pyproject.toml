[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymem"
version = "0.1.0"
description = "Python CLI for document chunking, embedding, and hybrid search"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
pymem = "pymem.cli:main"
