<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- 金属质感渐变 -->
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#808080;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#a0a0a0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#606060;stop-opacity:1"/>
    </linearGradient>
    <!-- 眼睛红宝石渐变 -->
    <radialGradient id="rubyEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff2020;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#cc0000;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#800000;stop-opacity:1"/>
    </radialGradient>
    <!-- 荆棘刺渐变 -->
    <linearGradient id="spike" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#909090"/>
      <stop offset="100%" style="stop-color:#d0d0d0"/>
    </linearGradient>
    <!-- 背景 -->
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </radialGradient>
    <!-- 红光辉光 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- === 身体主体 === -->
  <g transform="translate(300, 450)">

    <!-- 躯干 -->
    <path d="M-45,-120 L-55,-20 L-50,80 L-30,160 L30,160 L50,80 L55,-20 L45,-120 Z"
          fill="url(#metalBody)" stroke="#555" stroke-width="1.5"/>

    <!-- 胸甲纹路 -->
    <path d="M-30,-100 L0,-60 L30,-100" fill="none" stroke="#777" stroke-width="1.5"/>
    <path d="M-25,-70 L0,-30 L25,-70" fill="none" stroke="#777" stroke-width="1"/>
    <path d="M-20,-40 L0,0 L20,-40" fill="none" stroke="#777" stroke-width="1"/>
    <line x1="0" y1="-120" x2="0" y2="80" stroke="#666" stroke-width="0.8" opacity="0.5"/>

    <!-- === 头部 === -->
    <g transform="translate(0, -170)">
      <!-- 头颅 - 长而窄，有棱角 -->
      <path d="M-30,0 L-35,-20 L-25,-50 L0,-65 L25,-50 L35,-20 L30,0 L20,15 L-20,15 Z"
            fill="url(#metalBody)" stroke="#555" stroke-width="1.5"/>

      <!-- 面部中脊 -->
      <line x1="0" y1="-65" x2="0" y2="15" stroke="#666" stroke-width="1"/>

      <!-- 眼睛 - 多面体红宝石 -->
      <g filter="url(#eyeGlow)">
        <polygon points="-18,-25 -10,-35 -5,-25 -10,-18" fill="url(#rubyEye)" stroke="#ff4444" stroke-width="0.5"/>
        <polygon points="18,-25 10,-35 5,-25 10,-18" fill="url(#rubyEye)" stroke="#ff4444" stroke-width="0.5"/>
      </g>

      <!-- 头顶荆棘冠 -->
      <polygon points="-20,-45 -25,-75 -18,-50" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <polygon points="-10,-55 -8,-90 -5,-58" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <polygon points="0,-60 5,-95 3,-62" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <polygon points="10,-55 15,-88 12,-58" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <polygon points="20,-45 28,-72 22,-48" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <!-- 侧面角 -->
      <polygon points="-32,-15 -55,-30 -33,-20" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <polygon points="32,-15 55,-30 33,-20" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <polygon points="-35,-5 -60,-10 -36,-8" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <polygon points="35,-5 60,-10 36,-8" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    </g>

    <!-- === 右上臂 (前方) === -->
    <g>
      <path d="M45,-110 L85,-70 L110,-20 L115,10 L120,5 L130,-15"
            fill="none" stroke="url(#metalBody)" stroke-width="8" stroke-linecap="round"/>
      <!-- 前臂 -->
      <path d="M115,10 L140,60 L155,90"
            fill="none" stroke="url(#metalBody)" stroke-width="6" stroke-linecap="round"/>
      <!-- 刀刃手指 -->
      <line x1="155" y1="90" x2="170" y2="120" stroke="#c0c0c0" stroke-width="2"/>
      <line x1="155" y1="90" x2="162" y2="125" stroke="#c0c0c0" stroke-width="2"/>
      <line x1="155" y1="90" x2="150" y2="122" stroke="#c0c0c0" stroke-width="2"/>
      <line x1="155" y1="90" x2="143" y2="115" stroke="#c0c0c0" stroke-width="1.5"/>
      <!-- 臂刺 -->
      <polygon points="85,-70 95,-100 90,-72" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <polygon points="110,-20 125,-45 113,-22" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <polygon points="130,40 150,25 133,38" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    </g>

    <!-- === 左上臂 (前方) === -->
    <g>
      <path d="M-45,-110 L-85,-70 L-110,-20 L-115,10 L-120,5 L-130,-15"
            fill="none" stroke="url(#metalBody)" stroke-width="8" stroke-linecap="round"/>
      <path d="M-115,10 L-140,60 L-155,90"
            fill="none" stroke="url(#metalBody)" stroke-width="6" stroke-linecap="round"/>
      <!-- 刀刃手指 -->
      <line x1="-155" y1="90" x2="-170" y2="120" stroke="#c0c0c0" stroke-width="2"/>
      <line x1="-155" y1="90" x2="-162" y2="125" stroke="#c0c0c0" stroke-width="2"/>
      <line x1="-155" y1="90" x2="-150" y2="122" stroke="#c0c0c0" stroke-width="2"/>
      <line x1="-155" y1="90" x2="-143" y2="115" stroke="#c0c0c0" stroke-width="1.5"/>
      <!-- 臂刺 -->
      <polygon points="-85,-70 -95,-100 -90,-72" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <polygon points="-110,-20 -125,-45 -113,-22" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <polygon points="-130,40 -150,25 -133,38" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    </g>

    <!-- === 右下臂 (第二对) === -->
    <g>
      <path d="M40,-60 L75,-20 L100,30 L110,60"
            fill="none" stroke="url(#metalBody)" stroke-width="7" stroke-linecap="round"/>
      <path d="M110,60 L125,110 L135,140"
            fill="none" stroke="url(#metalBody)" stroke-width="5" stroke-linecap="round"/>
      <!-- 刀刃手指 -->
      <line x1="135" y1="140" x2="148" y2="168" stroke="#c0c0c0" stroke-width="2"/>
      <line x1="135" y1="140" x2="140" y2="172" stroke="#c0c0c0" stroke-width="2"/>
      <line x1="135" y1="140" x2="128" y2="168" stroke="#c0c0c0" stroke-width="2"/>
      <line x1="135" y1="140" x2="122" y2="162" stroke="#c0c0c0" stroke-width="1.5"/>
      <!-- 臂刺 -->
      <polygon points="75,-20 88,-48 78,-22" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <polygon points="100,30 118,12 103,28" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    </g>

    <!-- === 左下臂 (第二对) === -->
    <g>
      <path d="M-40,-60 L-75,-20 L-100,30 L-110,60"
            fill="none" stroke="url(#metalBody)" stroke-width="7" stroke-linecap="round"/>
      <path d="M-110,60 L-125,110 L-135,140"
            fill="none" stroke="url(#metalBody)" stroke-width="5" stroke-linecap="round"/>
      <!-- 刀刃手指 -->
      <line x1="-135" y1="140" x2="-148" y2="168" stroke="#c0c0c0" stroke-width="2"/>
      <line x1="-135" y1="140" x2="-140" y2="172" stroke="#c0c0c0" stroke-width="2"/>
      <line x1="-135" y1="140" x2="-128" y2="168" stroke="#c0c0c0" stroke-width="2"/>
      <line x1="-135" y1="140" x2="-122" y2="162" stroke="#c0c0c0" stroke-width="1.5"/>
      <!-- 臂刺 -->
      <polygon points="-75,-20 -88,-48 -78,-22" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
      <polygon points="-100,30 -118,12 -103,28" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    </g>

    <!-- === 肩部荆棘 === -->
    <polygon points="45,-120 65,-165 50,-122" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="55,-115 80,-155 58,-118" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="-45,-120 -65,-165 -50,-122" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="-55,-115 -80,-155 -58,-118" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>

    <!-- 背部荆棘 -->
    <polygon points="15,-115 20,-160 18,-118" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="-15,-115 -20,-160 -18,-118" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="30,-100 40,-145 33,-103" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="-30,-100 -40,-145 -33,-103" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>

    <!-- 躯干侧面荆棘 -->
    <polygon points="55,-20 78,-35 57,-23" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="-55,-20 -78,-35 -57,-23" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="50,40 72,28 52,38" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="-50,40 -72,28 -52,38" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="45,80 68,70 47,78" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="-45,80 -68,70 -47,78" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>

    <!-- === 腿部 === -->
    <!-- 右腿 -->
    <path d="M25,160 L35,250 L40,340 L38,380"
          fill="none" stroke="url(#metalBody)" stroke-width="10" stroke-linecap="round"/>
    <!-- 右小腿（反关节） -->
    <path d="M38,380 L55,340 L50,410 L45,440"
          fill="none" stroke="url(#metalBody)" stroke-width="8" stroke-linecap="round"/>
    <!-- 右脚爪 -->
    <path d="M45,440 L60,455 L70,458" fill="none" stroke="#aaa" stroke-width="3" stroke-linecap="round"/>
    <path d="M45,440 L45,458 L42,462" fill="none" stroke="#aaa" stroke-width="3" stroke-linecap="round"/>
    <path d="M45,440 L30,455 L22,456" fill="none" stroke="#aaa" stroke-width="3" stroke-linecap="round"/>
    <!-- 腿刺 -->
    <polygon points="35,250 52,230 37,248" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="40,340 58,325 42,338" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="55,340 72,330 57,338" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>

    <!-- 左腿 -->
    <path d="M-25,160 L-35,250 L-40,340 L-38,380"
          fill="none" stroke="url(#metalBody)" stroke-width="10" stroke-linecap="round"/>
    <path d="M-38,380 L-55,340 L-50,410 L-45,440"
          fill="none" stroke="url(#metalBody)" stroke-width="8" stroke-linecap="round"/>
    <!-- 左脚爪 -->
    <path d="M-45,440 L-60,455 L-70,458" fill="none" stroke="#aaa" stroke-width="3" stroke-linecap="round"/>
    <path d="M-45,440 L-45,458 L-42,462" fill="none" stroke="#aaa" stroke-width="3" stroke-linecap="round"/>
    <path d="M-45,440 L-30,455 L-22,456" fill="none" stroke="#aaa" stroke-width="3" stroke-linecap="round"/>
    <!-- 腿刺 -->
    <polygon points="-35,250 -52,230 -37,248" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="-40,340 -58,325 -42,338" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>
    <polygon points="-55,340 -72,330 -57,338" fill="url(#spike)" stroke="#888" stroke-width="0.5"/>

    <!-- === 胸口荆棘树（标志性） === -->
    <g filter="url(#glow)" opacity="0.6">
      <line x1="0" y1="-20" x2="0" y2="60" stroke="#cc3333" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-15" y2="-20" stroke="#cc3333" stroke-width="1"/>
      <line x1="0" y1="0" x2="15" y2="-20" stroke="#cc3333" stroke-width="1"/>
      <line x1="0" y1="20" x2="-12" y2="5" stroke="#cc3333" stroke-width="1"/>
      <line x1="0" y1="20" x2="12" y2="5" stroke="#cc3333" stroke-width="1"/>
      <line x1="0" y1="40" x2="-10" y2="28" stroke="#cc3333" stroke-width="1"/>
      <line x1="0" y1="40" x2="10" y2="28" stroke="#cc3333" stroke-width="1"/>
    </g>

  </g>

  <!-- 标题已移除 -->
</svg>