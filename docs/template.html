<script>
// 过滤状态：日期 / 相关度 / 标签 / 搜索词。所有过滤组合生效,并同步到 URL hash。
const filterState = { date: '', rel: 'all', tag: 'all', q: '' };

function switchDate(date) {
  filterState.date = date;
  const select = document.getElementById('date-select');
  if (select && select.value !== date) select.value = date;
  applyFilters();
  updateHash();
}

function filterRelevance(level, btn) {
  filterState.rel = level;
  setActiveButton('relevance-filters', btn || (typeof event !== 'undefined' ? event.target : null));
  applyFilters();
  updateHash();
}

function filterTag(tag, btn) {
  filterState.tag = tag;
  setActiveButton('tag-filters', btn || (typeof event !== 'undefined' ? event.target : null));
  applyFilters();
  updateHash();
}

function setActiveButton(groupId, btn) {
  document.querySelectorAll('#' + groupId + ' .filter-btn').forEach(b => {
    b.classList.toggle('active', b === btn);
  });
}

function cardMatches(card) {
  if (filterState.rel !== 'all') {
    const rel = parseInt(card.getAttribute('data-relevance') || '1');
    if (rel !== filterState.rel) return false;
  }
  if (filterState.tag !== 'all') {
    const tags = (card.getAttribute('data-tags') || '').split(',');
    if (!tags.includes(filterState.tag)) return false;
  }
  if (filterState.q) {
    const title = (card.querySelector('.paper-title') || {}).textContent || '';
    const abstract = (card.querySelector('.paper-abstract') || {}).textContent || '';
    if (!(title + ' ' + abstract).toLowerCase().includes(filterState.q.toLowerCase())) return false;
  }
  return true;
}

function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.date-section').forEach(sec => {
    if (sec.getAttribute('data-date') !== filterState.date) {
      sec.style.display = 'none';
      return;
    }
    let sectionVisible = 0;
    sec.querySelectorAll('.paper-card').forEach(card => {
      const show = cardMatches(card);
      card.style.display = show ? '' : 'none';
      if (show) sectionVisible++;
    });
    sec.style.display = sectionVisible > 0 ? '' : 'none';
    visible = sectionVisible;
  });
  const hint = document.getElementById('no-match');
  if (hint) hint.style.display = visible === 0 ? '' : 'none';
}

// --- URL hash 状态:#tag=Agent&date=2026-08-18&q=graphrag ---
function buildHash() {
  const parts = [];
  const select = document.getElementById('date-select');
  const defaultDate = select && select.options.length ? select.options[0].value : '';
  if (filterState.date && filterState.date !== defaultDate) parts.push('date=' + encodeURIComponent(filterState.date));
  if (filterState.rel !== 'all') parts.push('rel=' + filterState.rel);
  if (filterState.tag !== 'all') parts.push('tag=' + encodeURIComponent(filterState.tag));
  if (filterState.q) parts.push('q=' + encodeURIComponent(filterState.q));
  return parts.join('&');
}

function updateHash() {
  const hash = buildHash();
  history.replaceState(null, '', hash ? '#' + hash : location.pathname + location.search);
}

function parseHash(hash) {
  const out = {};
  (hash || '').replace(/^#/, '').split('&').forEach(pair => {
    if (!pair) return;
    const eq = pair.indexOf('=');
    if (eq < 0) return;
    const key = pair.slice(0, eq);
    const value = decodeURIComponent(pair.slice(eq + 1));
    if (['date', 'rel', 'tag', 'q'].includes(key)) out[key] = value;
  });
  return out;
}

function restoreFromHash() {
  const parsed = parseHash(location.hash);
  const select = document.getElementById('date-select');

  // date: 只接受 selector 里存在的日期
  let date = select && select.options.length ? select.options[0].value : '';
  if (parsed.date && select &&
      Array.from(select.options).some(o => o.value === parsed.date)) {
    date = parsed.date;
  }
  filterState.date = date;
  if (select) select.value = date;

  // relevance
  filterState.rel = 'all';
  const relBtns = document.querySelectorAll('#relevance-filters .filter-btn');
  let relBtn = relBtns[0];
  if (parsed.rel && ['1', '2', '3'].includes(parsed.rel)) {
    filterState.rel = parseInt(parsed.rel);
    relBtns.forEach(b => {
      if ((b.getAttribute('onclick') || '').includes('(' + parsed.rel + ')')) relBtn = b;
    });
  }
  setActiveButton('relevance-filters', relBtn);

  // tag: 只接受存在对应按钮的标签
  filterState.tag = 'all';
  const tagBtns = document.querySelectorAll('#tag-filters .filter-btn');
  let tagBtn = tagBtns[0];
  if (parsed.tag) {
    tagBtns.forEach(b => {
      if (b.textContent === parsed.tag) { filterState.tag = parsed.tag; tagBtn = b; }
    });
  }
  setActiveButton('tag-filters', tagBtn);

  // search
  filterState.q = parsed.q || '';
  const input = document.getElementById('search-input');
  if (input) input.value = filterState.q;

  applyFilters();
}

// --- 稍后读清单(#8):localStorage 持久化,纯前端 ---
// 存储结构:{ [id]: {id, title, url, pdf, date, read, added} }
// id 优先取 arXiv id(用于构造 BibTeX),否则退化为论文 URL。
const RL_KEY = 'paperReadLater';

function rlLoad() {
  try {
    return JSON.parse(localStorage.getItem(RL_KEY)) || {};
  } catch (e) {
    return {};
  }
}

function rlSave(items) {
  localStorage.setItem(RL_KEY, JSON.stringify(items));
  rlRender();
}

function arxivIdFromUrl(url) {
  const m = (url || '').match(/arxiv\.org\/(?:abs|pdf)\/([0-9]{4}\.[0-9]{4,5})(?:v\d+)?/);
  return m ? m[1] : null;
}

function cardPaperInfo(card) {
  const titleEl = card.querySelector('.paper-title');
  const url = titleEl ? titleEl.getAttribute('href') : '';
  const pdfEl = Array.from(card.querySelectorAll('.paper-links a'))
    .find(a => a.textContent.includes('PDF'));
  const section = card.closest('.date-section');
  return {
    id: arxivIdFromUrl(url) || url,
    title: titleEl ? titleEl.textContent.trim() : '',
    url: url,
    pdf: pdfEl ? pdfEl.getAttribute('href') : '',
    date: section ? section.getAttribute('data-date') : '',
  };
}

function toggleReadLater(btn) {
  const card = btn.closest('.paper-card');
  const info = cardPaperInfo(card);
  if (!info.id) return;
  const items = rlLoad();
  if (items[info.id]) {
    delete items[info.id];
  } else {
    info.read = false;
    info.added = Date.now();
    items[info.id] = info;
  }
  rlSave(items);
}

function rlMarkRead(id) {
  const items = rlLoad();
  if (items[id]) {
    items[id].read = true;
    rlSave(items);
  }
}

function rlRemove(id) {
  const items = rlLoad();
  delete items[id];
  rlSave(items);
}

function rlSorted() {
  return Object.values(rlLoad()).sort((a, b) => (b.added || 0) - (a.added || 0));
}

function rlRender() {
  const items = rlSorted();
  const unread = items.filter(it => !it.read).length;

  // 徽章:未读数
  const badge = document.getElementById('rl-badge');
  if (badge) badge.textContent = unread > 0 ? String(unread) : '';

  // 卡片上的 ☆/★ 状态
  const saved = rlLoad();
  document.querySelectorAll('.paper-card').forEach(card => {
    const btn = card.querySelector('.star-btn');
    if (!btn) return;
    const info = cardPaperInfo(card);
    const active = !!saved[info.id];
    btn.textContent = active ? '★' : '☆';
    btn.classList.toggle('active', active);
    btn.title = active ? '从稍后读移除' : '稍后读';
  });

  // 模态列表
  const list = document.getElementById('rl-list');
  if (!list) return;
  if (items.length === 0) {
    list.innerHTML = '<div class="rl-empty">还没有收藏。点击论文卡片上的 ☆ 加入稍后读。</div>';
  } else {
    list.innerHTML = items.map(it =>
      '<div class="rl-item"' + (it.read ? ' style="opacity:0.55"' : '') + '>' +
      '<a href="' + it.url + '" target="_blank" rel="noopener" ' +
      'onclick="rlMarkRead(\'' + it.id + '\')">' + escHtml(it.title) + '</a>' +
      '<span class="rl-date">' + (it.date || '') + '</span>' +
      '<button class="rl-remove" onclick="rlRemove(\'' + it.id + '\')" title="移除">✕</button>' +
      '</div>').join('');
  }
  const disabled = items.length === 0;
  const bib = document.getElementById('rl-export-bibtex');
  const md = document.getElementById('rl-export-md');
  if (bib) bib.disabled = disabled;
  if (md) md.disabled = disabled;
}

function escHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function openReadLater(e) {
  if (e) e.preventDefault();
  rlRender();
  document.getElementById('rl-overlay').classList.add('open');
}

function closeReadLater() {
  document.getElementById('rl-overlay').classList.remove('open');
}

// --- 导出 ---
function buildBibtex() {
  return rlSorted().map(it => {
    const arxivId = arxivIdFromUrl(it.url);
    if (arxivId) {
      // arXiv id YYMM.NNNNN → 年份 20YY
      const year = '20' + arxivId.slice(0, 2);
      return '@misc{arxiv' + arxivId.replace('.', '_') + ',\n' +
        '  title = {' + it.title.replace(/[{}]/g, '') + '},\n' +
        '  year = {' + year + '},\n' +
        '  eprint = {' + arxivId + '},\n' +
        '  archivePrefix = {arXiv},\n' +
        '  url = {' + it.url + '}\n' +
        '}';
    }
    return '@misc{' + (it.date || 'paper').replace(/-/g, '') + ',\n' +
      '  title = {' + it.title.replace(/[{}]/g, '') + '},\n' +
      '  url = {' + it.url + '}\n' +
      '}';
  }).join('\n\n') + '\n';
}

function buildMarkdown() {
  const lines = ['# 稍后读清单', ''];
  rlSorted().forEach(it => {
    let line = '- [' + it.title + '](' + it.url + ')';
    if (it.pdf) line += ' · [PDF](' + it.pdf + ')';
    if (it.date) line += ' — ' + it.date;
    lines.push(line);
  });
  lines.push('');
  return lines.join('\n');
}

function downloadText(filename, text, mime) {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
}

function exportBibtex() {
  downloadText('read-later.bib', buildBibtex(), 'application/x-bibtex');
}

function exportMarkdown() {
  downloadText('read-later.md', buildMarkdown(), 'text/markdown');
}

// 给每张卡片注入 ☆ 按钮(生成器产出的卡片是静态 HTML,前端增强)
function rlInjectButtons() {
  document.querySelectorAll('.paper-card .paper-header').forEach(header => {
    if (header.querySelector('.star-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'star-btn';
    btn.textContent = '☆';
    btn.title = '稍后读';
    btn.addEventListener('click', () => toggleReadLater(btn));
    header.appendChild(btn);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('search-input');
  if (input) {
    let timer;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        filterState.q = input.value.trim();
        applyFilters();
        updateHash();
      }, 200);
    });
  }
  restoreFromHash();
  rlInjectButtons();
  rlRender();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeReadLater();
});

// 浏览器前进/后退时恢复过滤状态（replaceState 不触发此事件,不会自循环）
window.addEventListener('hashchange', restoreFromHash);
</script>
