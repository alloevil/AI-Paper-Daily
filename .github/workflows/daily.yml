name: Daily AI Paper Daily

on:
  schedule:
    - cron: '0 4 * * *'  # UTC 4:00 = 北京时间 12:00,每日日报
    - cron: '0 5 * * 1'  # UTC 5:00 周一 = 北京时间 13:00,论文周报
  workflow_dispatch:  # 手动触发
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        options: [daily, weekly]
        default: daily

permissions:
  contents: write

jobs:
  discover:
    if: github.event.schedule != '0 5 * * 1' && (github.event.inputs.mode || 'daily') == 'daily'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run AI Paper Daily
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/main.py

      # 没有新日报（如周末无新论文）时跳过后续步骤，避免只改时间戳的垃圾提交
      - name: Check for new report
        id: report
        run: |
          if git status --porcelain docs/ | grep -q '\.md$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new report generated, skipping site build and commit"
          fi

      - name: Generate site
        if: steps.report.outputs.changed == 'true'
        run: |
          python scripts/generate_site.py

      # GitHub Pages 从 main 分支 /docs 目录直接服务，提交即发布
      - name: Commit and push
        if: steps.report.outputs.changed == 'true'
        run: |
          git config user.name "AI Paper Daily Bot"
          git config user.email "bot@AI-Paper-Daily"
          git add -A
          git diff --staged --quiet || git commit -m "📄 Daily discovery $(date +%Y-%m-%d)"
          git push

  weekly:
    if: github.event.schedule == '0 5 * * 1' || github.event.inputs.mode == 'weekly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 周报只重排已有历史,不做新采集;推送日志独立(feishu-weekly/email-weekly),
      # 不影响日报的去重逻辑
      - name: Run AI Paper Weekly
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/main.py --weekly

      - name: Check for new report
        id: report
        run: |
          if git status --porcelain docs/ | grep -q '\.md$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No weekly report generated, skipping commit"
          fi

      # 周报进站点:渲染 weekly-*.html 页面 + 首页导航链接 + feed 条目
      - name: Generate site
        if: steps.report.outputs.changed == 'true'
        run: |
          python scripts/generate_site.py

      - name: Commit and push
        if: steps.report.outputs.changed == 'true'
        run: |
          git config user.name "AI Paper Daily Bot"
          git config user.email "bot@AI-Paper-Daily"
          git add -A
          git diff --staged --quiet || git commit -m "📊 Weekly roundup $(date +%Y-%m-%d)"
          git push
