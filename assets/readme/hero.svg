    <text x="118" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="700" fill="#F2F4F8">Collection</text>
    <text x="86" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#F2F4F8">arXiv API</text>
    <text x="86" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#F2F4F8">HuggingFace</text>
    <text x="86" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#F2F4F8">Daily Papers</text>
    <text x="86" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#9AA3B8">cs.AI cs.CL cs.IR cs.MA</text>
    <text x="86" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#9AA3B8">wider Sun/Mon window</text>
  </g>

  <path d="M320 278 L330 286 L320 294" fill="none" stroke="#6EA8FE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

