    <rect x="612" y="198" width="250" height="176" rx="16" fill="#171A23" stroke="#262C3D" stroke-width="1.5"/>
    <text x="634" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#6EA8FE">03</text>
    <text x="666" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="700" fill="#F2F4F8">Persistence</text>
    <text x="634" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#F2F4F8">top <tspan fill="#F0B357" font-weight="700">10</tspan> per day</text>
