    <text x="634" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#9AA3B8">committed to git</text>
    <text x="634" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#9AA3B8">GitHub Pages site</text>
  </g>

  <path d="M868 278 L878 286 L868 294" fill="none" stroke="#6EA8FE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

