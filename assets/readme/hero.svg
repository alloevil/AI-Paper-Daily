    <text x="360" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#9AA3B8"><tspan fill="#6EA8FE" font-weight="700">2</tspan>  novelty / value</text>
    <text x="360" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#9AA3B8"><tspan fill="#6EA8FE" font-weight="700">3</tspan>  open code first</text>
    <text x="360" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#9AA3B8"><tspan fill="#6EA8FE" font-weight="700">4</tspan>  votes / stars</text>
  </g>

  <path d="M594 278 L604 286 L594 294" fill="none" stroke="#6EA8FE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

